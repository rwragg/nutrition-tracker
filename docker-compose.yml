services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: nutrition-tracker:local
    ports:
      - "${NUTRITION_PORT:-8000}:8000"
    environment:
      # The sample is seeded with dates relative to "today", and the browser decides what today is
      # when it opens the log. A container on UTC would seed a day ahead of the person reading it,
      # so the seeded day would not be the day the app opens on. Override TZ for another zone.
      TZ: "${TZ:-America/New_York}"
      # The app validates the bot's header against this too (R26): the two sides share one secret,
      # so both services need it. Missing here means the bot is told "no secret configured" and
      # every chat is refused - which is what the bot's preflight catches at startup.
      TELEGRAM_BOT_SECRET: ${TELEGRAM_BOT_SECRET:-}
    volumes:
      # The database lives here. Without the volume, `docker compose up --build` would
      # start from an empty file every time and the log would look like it was wiped.
      - nutrition-data:/data
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "--no-dev", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # The Telegram front end: a second client of the same API, not a second implementation of
  # it, so it shares the image and holds no records of its own.
  #
  # Opt-in, behind a profile: `docker compose up -d` starts the app alone, exactly as before,
  # and the bot starts only when it is asked for by name. That keeps a missing token from
  # taking the app down with it — and the token is not defaulted to anything here, because a
  # default would be a credential.
  #
  #   docker compose --profile bot up -d --build
  #
  # restart is deliberately "no". The bot exits non-zero with a reason when it has no token
  # or cannot reach the API, and a restart policy would turn that into a loop of identically
  # failing starts — a misconfiguration dressed up as a service.
  bot:
    profiles: ["bot"]
    image: nutrition-tracker:local
    command: ["uv", "run", "--no-sync", "--no-dev", "python", "-m", "app.bot"]
    environment:
      NUTRITION_API: http://backend:8000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_SECRET: ${TELEGRAM_BOT_SECRET:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

volumes:
  nutrition-data:
