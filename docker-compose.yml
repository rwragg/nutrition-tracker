services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: nutrition-tracker:local
    ports:
      - "${NUTRITION_PORT:-8000}:8000"
    environment:
      # The sample is seeded with dates relative to "today", and the browser decides what today is
      # when it opens the log. A container on UTC would seed a day ahead of the person reading it,
      # so the seeded day would not be the day the app opens on. Override TZ for another zone.
      TZ: "${TZ:-America/New_York}"
    volumes:
      # The database lives here. Without the volume, `docker compose up --build` would
      # start from an empty file every time and the log would look like it was wiped.
      - nutrition-data:/data
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "--no-dev", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  nutrition-data:
