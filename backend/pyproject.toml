[project]
name = "nutrition-backend"
version = "0.1.0"
description = "FastAPI backend for the nutrition tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "itsdangerous>=2.2.0",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
